<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f172a">
<title>Mất kết nối - NhaDat Radar</title>
<!-- 2/11 (audit 🔴8): trang SW trả khi rớt mạng. CSS inline, không phụ thuộc chunk _next. Token ZEN Kaiz, bo 4px. -->
<script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.className=t}catch(e){}</script>
<style>
:root{--bg:#f1f5f9;--surface:#fff;--ink:#0f172a;--muted:#334155;--line:#cbd5e1;--brand:#059669;--brand-text:#047857}
@media (prefers-color-scheme:dark){:root:not(.light){--bg:#0b1120;--surface:#1e293b;--ink:#f8fafc;--muted:#cbd5e1;--line:#334155;--brand:#10b981;--brand-text:#34d399}}
:root.dark{--bg:#0b1120;--surface:#1e293b;--ink:#f8fafc;--muted:#cbd5e1;--line:#334155;--brand:#10b981;--brand-text:#34d399}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
main{width:100%;max-width:360px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:24px 20px}
svg{display:block;margin:0 auto 12px;color:var(--brand-text)}
h1{font-size:20px;line-height:1.35;margin:0 0 8px}
p{color:var(--muted);margin:0 0 20px}
a,button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;border-radius:4px;font:600 16px Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;text-decoration:none;margin-top:10px;cursor:pointer}
button{background:var(--brand);color:#fff;border:0}
a{border:1px solid var(--brand);color:var(--brand-text);background:transparent}
a:focus-visible,button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
</style>
</head>
<body>
<main>
<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h.01"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><path d="M5 12.86a10 10 0 0 1 5.17-2.69"/><path d="M19 12.86a10 10 0 0 0-2-1.5"/><path d="M2 8.82a15 15 0 0 1 4.17-2.65"/><path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"/><path d="m2 2 20 20"/></svg>
<h1>Mất kết nối mạng</h1>
<p>Kiểm tra Wi-Fi hoặc 4G rồi thử lại. Cần gấp thì gọi hotline, cuộc gọi không cần mạng dữ liệu.</p>
<button type="button" onclick="location.reload()">Thử lại</button>
<a href="tel:0387365020">Gọi 0387 365 020</a>
</main>
<script>addEventListener("online",function(){location.reload()})</script>
</body>
</html>
