name: probe-sites
# Thăm dò các trang BĐS ứng viên từ IP GitHub Actions: trang nào trả HTML thật
# thì lưu mẫu làm artifact để viết parser. Chạy tay khi cần (workflow_dispatch).
on: workflow_dispatch

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe candidate sites
        run: |
          mkdir -p samples
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          for u in \
            "https://nhadat24h.com" \
            "https://batdongsantoanquoc.vn" \
            "https://rongbay.com/Ha-Noi/Nha-dat-c7.html" \
            "https://nhadatuytin24h.com" \
            "https://sosanhnha.com" \
            "https://www.123nhadat.net" \
            "https://timmuanhadat.com.vn" \
            "https://bannhadat123.vn" \
          ; do
            name=$(echo "$u" | sed 's#https\?://##; s#[/.]#_#g' | cut -c1-40)
            code=$(curl -sL --max-time 15 -A "$UA" -o "samples/$name.html" -w "%{http_code}" "$u" || echo "ERR")
            size=$(wc -c < "samples/$name.html" 2>/dev/null || echo 0)
            echo "$code  $size  $u"
          done
          ls -la samples/
      - name: Dump structure for parser writing
        run: |
          for f in samples/*.html; do
            size=$(wc -c < "$f")
            [ "$size" -lt 20000 ] && continue
            echo "===================== $f ($size bytes) ====================="
            echo "--- top classes ---"
            grep -oE 'class="[^"]{4,70}"' "$f" | sort | uniq -c | sort -rn | head -25
            echo "--- sample hrefs (listing-like) ---"
            grep -oE 'href="[^"]{15,140}"' "$f" | grep -iE 'ban|thue|nha|dat|can-ho|-p[0-9]|\.html' | head -15
            echo "--- price snippets ---"
            grep -oE '>[^<>]{0,40}(tỷ|triệu|Tỷ|Triệu)[^<>]{0,25}<' "$f" | head -10
            echo "--- title-ish headings ---"
            grep -oE '<(h[1-4]|a)[^>]{0,120}title="[^"]{20,120}"' "$f" | head -8
          done
      - uses: actions/upload-artifact@v4
        with:
          name: site-samples
          path: samples/
          retention-days: 3
