name: E2E tests

on:
  pull_request: {}          # mỗi PR chạy toàn bộ unit + e2e trên web production
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL cần test (mặc định production)"
        required: false
  schedule:
    - cron: "30 2 * * *"    # 09:30 VN, sau crawl 09:00 — canh dữ liệu mới không làm vỡ web

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci

      # Chặn BYTE ĐIỀU KHIỂN lọt vào mã nguồn (review /ultrareview).
      # Commit 4dade2d từng nhét 5 byte BACKSPACE (0x08) vào GIỮA các regex — "m\x08", "\x08đất\x08",
      # "\x08kho\x08"… — khiến những nhánh đó KHÔNG BAO GIỜ khớp được. Mắt thường không thấy, diff
      # không hiện, review không bắt, và lỗi sống trọn một commit. Chốt chặn này rẻ và không bao giờ
      # phải bảo trì. (Cho phép TAB 0x09, LF 0x0A, CR 0x0D.)
      - name: Không cho byte điều khiển lọt vào mã nguồn
        run: |
          if grep -rlP '[\x00-\x08\x0B\x0C\x0E-\x1F]' \
               --include='*.mjs' --include='*.ts' --include='*.tsx' --include='*.js' \
               --exclude-dir=node_modules --exclude-dir=.next . ; then
            echo "::error::Có byte điều khiển trong các file trên — gần như chắc chắn là lỗi dán nhầm, hãy gỡ trước khi merge."
            exit 1
          fi
          echo "Sạch: không có byte điều khiển."

      # chromium cho desktop + webkit cho project iPhone 14 (thiếu webkit = 19 ca mobile fail, 17/8)
      - run: npx playwright install --with-deps chromium webkit
      - name: Run tests
        run: npx playwright test
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'https://nha-dat-radar-rkyn.vercel.app' }}
      - name: Upload báo cáo HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/report-html
          retention-days: 14
