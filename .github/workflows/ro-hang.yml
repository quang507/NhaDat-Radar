name: Rổ hàng EvoHome - tự cập nhật phòng trống

on:
  # 28/9: TẮT lịch tự chạy - EvoHome có Cloudflare chặn IP máy chủ GitHub (trang "Just a moment...",
  # 2/2 lượt thử đều hỏng). Chạy ở MÁY NHÀ bằng RO-HANG.bat (hoặc CHAY.bat). Giữ bấm tay để thử lại
  # nếu sau này EvoHome bỏ chặn.
  workflow_dispatch: {}

concurrency:
  group: ro-hang
  cancel-in-progress: false

jobs:
  evohome:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Repo PUBLIC: log chỉ in số đếm, không in địa chỉ/hoa hồng. File data nằm ở crawler/private
      # trên runner, xoá cùng máy ảo khi job xong.
      - name: Cào EvoHome
        run: node crawler/evohome-fetch.mjs
        env:
          EVOHOME_PHONE: ${{ secrets.EVOHOME_PHONE }}
          EVOHOME_PASSWORD: ${{ secrets.EVOHOME_PASSWORD }}
      - name: Đưa lên web (che số nhà, lệch toạ độ, ẩn phòng đã thuê)
        run: node crawler/ro-hang-evohome.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
