name: Daily crawl - làm mới data BĐS

on:
  schedule:
    - cron: "0 2 * * *"     # 02:00 UTC = 09:00 giờ Việt Nam
    - cron: "0 8 * * *"     # 08:00 UTC = 15:00 giờ Việt Nam
  workflow_dispatch: {}      # cho phép bấm chạy tay ở tab Actions

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci
      # Chromium cho batdongsan.mjs (Cloudflare chặn fetch thẳng). Nếu CI vẫn bị chặn thì
      # batdongsan.mjs giữ file cũ và merge tự bỏ qua file quá 2 ngày — máy nhà cào bù.
      - run: npx playwright install --with-deps chromium
      # Facebook KHÔNG chạy trên CI: IP GitHub Actions bị FB chặn (kiểm chứng 14/8 —
      # 13 nhóm đều trả trang login, 0 bài, tốn ~9 phút mỗi run).
      # Muốn cào FB: chạy crawl-local.bat trên máy nhà (IP dân cư) — daily.mjs tự nhận.
      # Sự cố 16/8: bấm "Re-run" run cũ -> GitHub chạy lại COMMIT CŨ (seed kiểu xoá-chèn) -> DB mất ~1.600 tin.
      # Chặn: chỉ chạy ở lần thử đầu; muốn chạy tay thì dùng "Run workflow" (luôn lấy main mới nhất).
      # ⚠ KHỐI env: PHẢI nằm ngay dưới step chạy daily.mjs. Sự cố 16-17/8: chèn step
      # cảnh báo Re-run vào GIỮA `run:` và `env:` -> env rơi sang step echo, step crawl
      # chạy trắng biến môi trường -> daily.mjs thoát ngay ở "Thiếu NEXT_PUBLIC_SUPABASE_URL".
      - name: Crawl + seed Supabase
        if: github.run_attempt == 1
        run: node crawler/daily.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
          GEMINI_API_KEY3: ${{ secrets.GEMINI_API_KEY3 }}
          GEMINI_API_KEY4: ${{ secrets.GEMINI_API_KEY4 }}
          GEMINI_API_KEY5: ${{ secrets.GEMINI_API_KEY5 }}
          # Facebook qua Apify (tùy chọn - có thì FB tự cào mỗi ngày)
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          FB_GROUP_URLS: ${{ vars.FB_GROUP_URLS }}
          FB_POSTS: ${{ vars.FB_POSTS }}
          # Email báo tin mới (tùy chọn): key từ resend.com (free 100 mail/ngày)
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEXT_PUBLIC_SITE_URL: https://nha-dat-radar-rkyn.vercel.app
          # Vietmap geocode (tùy chọn - chính xác VN hơn Nominatim; free trial 60k request)
          VIETMAP_API_KEY: ${{ secrets.VIETMAP_API_KEY }}
          # Dự án mogi.vn/du-an: số trang list (10 dự án/trang) và tuổi tối đa của projects.json trước khi cào lại
          MOGI_PROJECT_PAGES: ${{ vars.MOGI_PROJECT_PAGES || 8 }}
          PROJECT_MAX_AGE_H: ${{ vars.PROJECT_MAX_AGE_H || 72 }}

      # Step cảnh báo phải nằm CUỐI (nó không có env:) — xem chú thích ở trên.
      - name: Bỏ qua vì là Re-run
        if: github.run_attempt != 1
        run: echo "::warning::Bỏ qua — đây là Re-run của run cũ (chạy commit cũ). Dùng 'Run workflow' để chạy code mới nhất."
