name: Daily crawl - làm mới data BĐS

on:
  # GitHub tự cào các nguồn web (chotot, mogi, batdongsan, extra-sites) — KHÔNG cần máy
  # ở nhà bật. Facebook và Zalo vẫn phải chạy ở máy (IP dân cư + phiên đăng nhập), đó là
  # việc của CHAY.bat.
  schedule:
    # 4 tiếng/lần. Giờ UTC -> VN cộng 7: 01,05,09,13,17,21 UTC = 08,12,16,20,00,04 giờ VN.
    - cron: "0 1,5,9,13,17,21 * * *"
  workflow_dispatch: {}      # bấm chạy tay ở tab Actions

jobs:
  crawl:
    runs-on: ubuntu-latest
    # 18/8: do that 2 luot gan nhat deu 39 phut (commit 20c4c47 them nguon guland +
    # bat lai cao du an tren CI) -> sat nut timeout 40, chi can 1 nguon cham la bi cat
    # giua chung nhu luot 02:47. Repo public nen phut Actions mien phi -> noi rong 60.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci

      # ---- CACHE TOẠ ĐỘ (review /ultrareview) ----
      # crawler/geo-cache.json nằm trong .gitignore và ở đây TRƯỚC ĐÂY KHÔNG có bước cache nào,
      # nên mỗi lượt CI geocode lại từ con số 0 — 6 lượt/ngày, không lượt nào tích luỹ cho lượt sau.
      # Hai hậu quả đã đo được:
      #   1. MẤT DỮ LIỆU: cần tra 179 khoá quận + 182 khoá phường (chưa kể khoá đường) trong ngân
      #      sách 8 phút; khoá chưa kịp tra -> tin giữ lat=null -> seed ghi null ĐÈ lên toạ độ đang
      #      đúng trong DB. 61% tin (742/1218) phụ thuộc hoàn toàn vào geocode-all.
      #   2. ĐỐT HẠN MỨC: Vietmap Trial có trần 1.500 lượt/ngày, mỗi khoá tốn tối thiểu 2 request
      #      (search -> place) chưa kể fallback Nominatim và lượt thử lại bằng tên tỉnh cũ.
      # Toạ độ một phường/quận không bao giờ đổi -> cache dùng lại được vô thời hạn.
      # restore-keys cho phép nhận cache của lượt trước rồi ghi đè bản mới (cache GH bất biến theo key).
      - name: Khôi phục cache geocode
        uses: actions/cache/restore@v4
        with:
          path: crawler/geo-cache.json
          key: geo-cache-${{ github.run_id }}
          restore-keys: |
            geo-cache-

      # Chromium cho batdongsan.mjs (Cloudflare chặn fetch thẳng). Nếu CI vẫn bị chặn thì
      # batdongsan.mjs giữ file cũ và merge tự bỏ qua file quá 2 ngày — máy nhà cào bù.
      - run: npx playwright install --with-deps chromium
      # Facebook KHÔNG chạy trên CI: IP GitHub Actions bị FB chặn (kiểm chứng 14/8 —
      # 13 nhóm đều trả trang login, 0 bài, tốn ~9 phút mỗi run).
      # Muốn cào FB: chạy crawl-local.bat trên máy nhà (IP dân cư) — daily.mjs tự nhận.
      # Sự cố 16/8: bấm "Re-run" run cũ -> GitHub chạy lại COMMIT CŨ (seed kiểu xoá-chèn) -> DB mất ~1.600 tin.
      # Chặn: chỉ chạy ở lần thử đầu; muốn chạy tay thì dùng "Run workflow" (luôn lấy main mới nhất).
      # ⚠ KHỐI env: PHẢI nằm ngay dưới step chạy daily.mjs. Sự cố 16-17/8: chèn step
      # cảnh báo Re-run vào GIỮA `run:` và `env:` -> env rơi sang step echo, step crawl
      # chạy trắng biến môi trường -> daily.mjs thoát ngay ở "Thiếu NEXT_PUBLIC_SUPABASE_URL".
      - name: Crawl + seed Supabase
        if: github.run_attempt == 1
        run: node crawler/daily.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
          GEMINI_API_KEY3: ${{ secrets.GEMINI_API_KEY3 }}
          GEMINI_API_KEY4: ${{ secrets.GEMINI_API_KEY4 }}
          GEMINI_API_KEY5: ${{ secrets.GEMINI_API_KEY5 }}
          # FB không chạy trên CI (xem chú thích trên) — biến này chỉ để crawler máy nhà dùng chung cấu hình.
          # 17/8: đã bỏ APIFY_TOKEN, FB chỉ còn cào bằng Playwright + cookie ở máy nhà (miễn phí).
          FB_GROUP_URLS: ${{ vars.FB_GROUP_URLS }}
          FB_POSTS: ${{ vars.FB_POSTS }}
          # Email báo tin mới (tùy chọn): key từ resend.com (free 100 mail/ngày)
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEXT_PUBLIC_SITE_URL: https://nhadatradar.com
          # Vietmap geocode (tùy chọn - chính xác VN hơn Nominatim; free trial 60k request)
          VIETMAP_API_KEY: ${{ secrets.VIETMAP_API_KEY }}
          # Dự án mogi.vn/du-an: số trang list (10 dự án/trang) và tuổi tối đa của projects.json trước khi cào lại
          MOGI_PROJECT_PAGES: ${{ vars.MOGI_PROJECT_PAGES || 8 }}
          PROJECT_MAX_AGE_H: ${{ vars.PROJECT_MAX_AGE_H || 72 }}

      # Lưu cache geocode kể cả khi bước cào hỏng giữa chừng — phần khoá đã tra được vẫn quý.
      - name: Lưu cache geocode
        if: always() && github.run_attempt == 1
        uses: actions/cache/save@v4
        with:
          path: crawler/geo-cache.json
          key: geo-cache-${{ github.run_id }}

      # Step cảnh báo phải nằm CUỐI (nó không có env:) — xem chú thích ở trên.
      - name: Bỏ qua vì là Re-run
        if: github.run_attempt != 1
        run: echo "::warning::Bỏ qua — đây là Re-run của run cũ (chạy commit cũ). Dùng 'Run workflow' để chạy code mới nhất."
