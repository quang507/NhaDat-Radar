name: Daily crawl - làm mới data BĐS

on:
  schedule:
    - cron: "0 22 * * *"    # 22:00 UTC = 05:00 giờ Việt Nam mỗi ngày
  workflow_dispatch: {}      # cho phép bấm chạy tay ở tab Actions

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci
      # Facebook qua Playwright (free): cần secret FB_COOKIES_JSON (export cookies từ acc clone).
      # Guard bằng shell (KHÔNG dùng secrets trong 'if:' - GitHub Actions cấm, gây startup_failure).
      - name: Chuẩn bị Playwright cho Facebook
        run: |
          if [ -n "$FB_COOKIES_JSON" ]; then
            echo "$FB_COOKIES_JSON" > crawler/fb-cookies.json
            npm i playwright --no-save
            npx playwright install chromium --with-deps
            echo "FB Playwright sẵn sàng."
          else
            echo "Không có FB_COOKIES_JSON -> bỏ qua Playwright (FB sẽ dùng Apify nếu có token)."
          fi
        env:
          FB_COOKIES_JSON: ${{ secrets.FB_COOKIES_JSON }}
      - name: Crawl + seed Supabase
        run: node crawler/daily.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
          GEMINI_API_KEY3: ${{ secrets.GEMINI_API_KEY3 }}
          GEMINI_API_KEY4: ${{ secrets.GEMINI_API_KEY4 }}
          GEMINI_API_KEY5: ${{ secrets.GEMINI_API_KEY5 }}
          # Facebook qua Apify (tùy chọn - có thì FB tự cào mỗi ngày)
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          FB_GROUP_URLS: ${{ vars.FB_GROUP_URLS }}
          FB_POSTS: ${{ vars.FB_POSTS }}
          # Email báo tin mới (tùy chọn): key từ resend.com (free 100 mail/ngày)
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEXT_PUBLIC_SITE_URL: https://nha-dat-radar-rkyn.vercel.app
          # Vietmap geocode (tùy chọn - chính xác VN hơn Nominatim; free trial 60k request)
          VIETMAP_API_KEY: ${{ secrets.VIETMAP_API_KEY }}
