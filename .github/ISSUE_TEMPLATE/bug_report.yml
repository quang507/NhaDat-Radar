name: "🐛 Báo lỗi"
description: "Ghi nhận lỗi của web/crawler NhaDat Radar"
title: "[BUG] <trang hoặc luồng> — <hiện tượng>"
labels: ["bug"]
body:
  - type: dropdown
    id: severity
    attributes:
      label: Mức độ
      options:
        - "P0 — chặn release (sập trang, mất dữ liệu, không đăng nhập được)"
        - "P1 — quan trọng (luồng chính khó dùng, sai dữ liệu hiển thị)"
        - "P2 — nhỏ (giao diện lệch, chữ sai)"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Khu vực
      options: ["Trang chủ/Feed", "Tìm kiếm", "Chi tiết tin/Gallery", "Bản đồ", "Auth/Tài khoản", "Đăng tin/Dashboard", "Yêu thích", "Chatbot", "Crawler/Data", "Khác"]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Bước tái hiện
      placeholder: |
        1. Mở /search?province=Hà Nội
        2. Bấm ...
        3. Thấy ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Kỳ vọng vs thực tế
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Thiết bị/trình duyệt
      placeholder: "iPhone 14 Safari / Chrome 126 Windows"
  - type: textarea
    id: media
    attributes:
      label: Ảnh chụp / video / link tin lỗi
